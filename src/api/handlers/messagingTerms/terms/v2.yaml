# The terms of the message service, version 2. See `messagingTermsDocument.ts` for the format.
#
# `version` is what a participant agrees to: raise it (in a new file, v3.yaml) when the meaning
# changes, and everybody is asked again before their next message. `revision` is for fixes that
# change no meaning (a typo, a clearer word): raise it here, nobody is asked again.
# `terms.test.ts` pins the text of every version and revision; changing it without raising one of
# them fails the test. Never delete an older file: it is the record of what people agreed to.

version: 2
revision: 0

intro:
  de: Bevor du deine erste Nachricht schreibst, lies bitte die Regeln für die Nachrichten und stimme ihnen zu. Sie gelten für alle Konferenzen, an denen du mit diesem Konto teilnimmst.
  en: Before you write your first message, please read the rules for messages and agree to them. They apply to every conference you take part in with this account.

sections:
  - id: purpose
    icon: chats-circle
    title:
      de: Wofür die Nachrichten da sind
      en: What the messages are for
    summary:
      de: Austausch rund um die Konferenz. Kein privater Messenger.
      en: Talking about the conference. Not a private messenger.
    body:
      de:
        - 'Die Nachrichten dienen dem Austausch rund um die Konferenz: zur inhaltlichen Vorbereitung, zur Abstimmung in deiner Delegation und für Fragen an das Team. Sie sind kein privater Messenger und nur für Teilnehmende und Team der jeweiligen Konferenz gedacht.'
      en:
        - 'The messages are for talking about the conference: preparing its content, coordinating within your delegation and asking the team questions. They are not a private messenger and are meant only for the participants and the team of the conference.'
    callout:
      de: Die Nachrichten werden nicht rund um die Uhr gelesen. In einem Notfall wähle den Notruf 112 und wende dich vor Ort direkt an das Team.
      en: The messages are not read around the clock. In an emergency, call 112 and turn to the team on site directly.

  - id: respect
    icon: handshake
    title:
      de: Respektvoller Umgang
      en: Treating each other with respect
    summary:
      de: Andere kennst du nur in ihrer Rolle. Das bleibt so.
      en: You know the others only by their role. It stays that way.
    body:
      de:
        - Schreibe so, wie du selbst angeschrieben werden möchtest.
        - 'Andere Teilnehmende siehst du nur in ihrer Rolle, nicht mit ihrem Namen. Respektiere das: Dränge niemanden, Namen, Kontaktdaten, Fotos oder andere persönliche Angaben preiszugeben, gib keine persönlichen Daten anderer weiter und gib dich nicht als jemand anderes aus. Gib Inhalte aus Chats nicht ohne Einverständnis der Beteiligten weiter.'
      en:
        - Write the way you would like to be written to.
        - "You see other participants only by their role, not by their name. Respect that: do not push anybody to reveal their name, contact details, photos or other personal information, do not pass on other people's personal data and do not pretend to be somebody else. Do not pass on anything from a chat without the consent of the people in it."

  - id: prohibited
    icon: prohibit
    title:
      de: Verbotene Verhaltensweisen
      en: What is not allowed
    summary:
      de: 'Die Position deiner Rolle vertreten: ja. Menschen angreifen: nein.'
      en: "Standing up for your role's position: yes. Attacking people: no."
    body:
      de:
        - Beleidigungen, Drohungen, Einschüchterung, Mobbing, Belästigung und Hassrede haben hier keinen Platz. Dazu gehören auch sexualisierte Nachrichten und unerwünschte Annäherungen.
        - 'Niemand darf herabgesetzt oder benachteiligt werden, etwa wegen Herkunft, Hautfarbe, Nationalität, Sprache, Geschlecht(sidentität), sexueller Orientierung, Religion oder Weltanschauung, Behinderung, Alter, Aussehen oder sozialer Herkunft. Das gilt auch dann, wenn du in der Rolle eines Staates oder einer Organisation schreibst: Die Position deiner Rolle zu vertreten ist erwünscht, Menschen anzugreifen nicht.'
        - Verboten sind außerdem rechtswidrige, gewaltverherrlichende, pornografische und jugendgefährdende Inhalte, Aufrufe zu Gewalt oder Straftaten, Werbung, Spam und Kettennachrichten sowie Links zu solchen Inhalten.
      en:
        - Insults, threats, intimidation, bullying, harassment and hate speech have no place here. That includes sexualised messages and unwanted advances.
        - "Nobody may be belittled or put at a disadvantage, for instance because of their origin, skin colour, nationality, language, gender (identity), sexual orientation, religion or beliefs, disability, age, looks or social background. This holds even when you write in the role of a state or an organisation: standing up for your role's position is welcome, attacking people is not."
        - Also forbidden are unlawful content, content glorifying violence, pornographic content and content harmful to minors, calls for violence or crimes, advertising, spam and chain messages, and links to any of these.

  - id: readers
    icon: eye
    title:
      de: Wer deine Nachrichten lesen kann
      en: Who can read your messages
    summary:
      de: Nicht Ende-zu-Ende-verschlüsselt. Das Team kann im Bedarfsfall mitlesen.
      en: Not end-to-end encrypted. The team can read along when needed.
    body:
      de:
        - Chats mit anderen Teilnehmenden und die Gruppe deiner Delegation lesen zunächst nur die Beteiligten. Die Nachrichten sind nicht Ende-zu-Ende-verschlüsselt. Die Teilnehmendenbetreuung und die Projektleitung der Konferenz können die Nachrichten im Bedarfsfall mitlesen.
        - Jede beteiligte Person kann einen Chat melden. Die Meldung sieht nur die Teilnehmendenbetreuung und ggf. die Projektleitung der Konferenz. Bei einer Meldung liest die Teilnehmendenbetreuung den gesamten Chat und sieht, wer die Beteiligten sind. In der Meldung selbst kannst du kurz Stellung nehmen, welches Verhalten du melden möchtest. Wenn du Zweifel hast, ob du einen Chat melden solltest, dann melde ihn gerne und schildere deine Zweifel.
        - Nachrichten an ein Postfach des Teams (Teilnehmendenbetreuung, Vorsitz oder Gremienberatung) lesen alle Teammitglieder, die dieses Postfach betreuen. Sie sehen, wer du bist.
        - 'Eine Ausnahme sind Nachrichten an die Vertrauenspersonen: Sie werden nur von den Vertrauenspersonen gelesen, an die du schreibst, also von allen gemeinsam oder nur von der Person, die du auswählst. Das übrige Team liest sie nicht, sie können nicht gemeldet werden, und dein Name wird dort nicht angezeigt.'
        - 'Trotzdem sind die Nachrichten an die Vertrauenspersonen nicht ganz anonym: Wer die Plattform technisch betreibt, kann auf gespeicherte Daten zugreifen, soweit es für den Betrieb und die Sicherheit nötig ist. Ist eine Person in ernster Gefahr oder besteht eine gesetzliche Pflicht, können Nachrichten auch an zuständige Stellen weitergegeben werden. Wenn du das Vertrauensteam ganz anonym kontaktieren möchtest, dann nutze die von der Konferenz zur Verfügung gestellten anonymen Formulare oder Kontaktmöglichkeiten.'
      en:
        - Chats with other participants and your delegation's group are at first read only by the people in them. The messages are not end-to-end encrypted. The conference's participant care and project management can read the messages when needed.
        - Everybody in a chat can report it. Only participant care and, where needed, the conference's project management see the report. When a chat is reported, participant care reads the whole chat and sees who is in it. In the report itself you can briefly say which behaviour you want to report. If you are unsure whether to report a chat, please report it anyway and describe your doubts.
        - Messages to one of the team's inboxes (participant care, chairs or committee advisors) are read by every team member who looks after that inbox. They see who you are.
        - 'Messages to the trusted persons are the exception: they are read only by the trusted persons you write to, either all of them together or only the one you pick. The rest of the team does not read them, they cannot be reported, and your name is not shown there.'
        - 'Still, messages to the trusted persons are not entirely anonymous: whoever runs the platform technically can access stored data as far as running it and keeping it secure requires. If a person is in serious danger or the law requires it, messages can be passed on to the authorities in charge. If you want to reach the trusted persons fully anonymously, use the anonymous forms or other contact options the conference provides.'

  - id: protection
    icon: shield-check
    title:
      de: Blockieren und melden
      en: Blocking and reporting
    summary:
      de: 'Du musst dir nichts gefallen lassen: blockieren, melden oder vertraulich schreiben.'
      en: 'You do not have to put up with anything: block, report or write in confidence.'
    body:
      de:
        - Du musst dir nichts gefallen lassen. Im Menü eines Einzelchats kannst du eine Person jederzeit blockieren, dann könnt ihr euch nicht mehr schreiben.
        - Verstößt jemand gegen unsere Regeln, melde den Chat. Wenn du lieber vertraulich über etwas sprechen möchtest, schreibe den Vertrauenspersonen. Melde Chats nicht aus Spaß oder grundlos.
      en:
        - You do not have to put up with anything. In the menu of a one-to-one chat you can block a person at any time, and then the two of you can no longer write to each other.
        - If somebody breaks our rules, report the chat. If you would rather talk about something in confidence, write to the trusted persons. Do not report chats for fun or without a reason.

  - id: consequences
    icon: warning
    title:
      de: Was bei Verstößen passiert
      en: What happens when the rules are broken
    summary:
      de: Ausschluss aus den Chats, im schweren Fall von der Konferenz.
      en: Exclusion from the chats, in serious cases from the conference.
    body:
      de:
        - Die Teilnehmendenbetreuung prüft jede Meldung. Wer gegen diese Regeln verstößt, kann von den Chats mit anderen Teilnehmenden ausgeschlossen werden. Das Team erreichst du weiterhin.
        - Bei schweren oder wiederholten Verstößen sind weitere Schritte möglich, bis zum Ausschluss von der Konferenz. Bei Minderjährigen können Betreuende und Erziehungsberechtigte informiert werden.
      en:
        - Participant care looks into every report. Whoever breaks these rules can be excluded from the chats with other participants. You can still reach the team.
        - Serious or repeated violations can lead to further steps, up to exclusion from the conference. For minors, supervisors and parents or guardians can be informed.

  - id: storage
    icon: database
    title:
      de: Speicherung und E-Mails
      en: Storage and e-mails
    summary:
      de: Gesendete Nachrichten lassen sich nicht ändern oder löschen.
      en: Sent messages cannot be changed or deleted.
    body:
      de:
        - Gesendete Nachrichten lassen sich nicht nachträglich ändern oder löschen. Sie werden zusammen mit den übrigen Daten der Konferenz gespeichert.
        - Bleibt eine Nachricht an dich eine Weile ungelesen, erinnert dich eine E-Mail daran. Sie enthält nie den Text der Nachricht, und du kannst sie unter deinen Chats abschalten.
      en:
        - Sent messages cannot be changed or deleted afterwards. They are stored together with the rest of the conference's data.
        - If a message to you stays unread for a while, an e-mail reminds you of it. It never contains the text of the message, and you can switch it off under your chats.

confirmations:
  - id: read-and-follow
    text:
      de: Ich habe die Nutzungsbedingungen gelesen und halte mich an sie.
      en: I have read the terms of use and will follow them.
  - id: exclusion-aware
    text:
      de: Mir ist bewusst, dass ein Missbrauch der Chatfunktion einen Ausschluss aus der Konferenz bewirken kann.
      en: I am aware that misusing the messages can lead to my exclusion from the conference.
