<!doctype html>
<html lang="%lang%" dir="%paraglide.textDirection%">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		%fontawesome.stylesheet%
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<script>
			// High contrast before the first paint, so the page never flashes in the other look.
			// Mirrors contrastIsMore in src/lib/helpers/contrast.ts
			try {
				var choice = localStorage.getItem('contrast');
				if (
					choice === 'more' ||
					(choice !== 'normal' && matchMedia('(prefers-contrast: more)').matches)
				) {
					document.documentElement.dataset.contrast = 'more';
				}
			} catch (e) {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
