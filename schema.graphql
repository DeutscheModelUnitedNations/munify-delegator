  """The signing algorithm, `RS256`."""
  alg: String

  """The public exponent, base64url."""
  e: String

  """The key type, `RSA`."""
  kty: String

  """The modulus, base64url."""
  n: String

  """What the key is for, if stated."""
  use: String
}

enum LayoutDocument {
  certificate
  contract
  guardianConsent
  mediaConsent
}

"""The locale in the format of a BCP 47 (RFC 5646) standard string"""
scalar Locale

type Mcpauditentry {
  arguments: JSON!
  clientId: ID

  """Get the conferences related to this mcpAuditEntry"""
  conference(orderBy: ConferenceOrderInputArgument, where: ConferenceWhereInputArgument): Conference!
  conferenceId: ID!
  createdAt: DateTime!
  durationMs: Int!
  id: ID!
  message: String
  outcome: McpcalloutcomeEnum!

  """
  The search distance of the object. If a search is provided, this field will be populated with the search distance.
  """
  search_distance: Float
  tool: String!

  """Get the users related to this mcpAuditEntry"""
  user(orderBy: UserOrderInputArgument, where: UserWhereInputArgument): User
  userId: ID
}

input McpauditentryOrderInputArgument {
  arguments: SortingParameter
  clientId: SortingParameter
  conferenceId: SortingParameter
  createdAt: SortingParameter
  durationMs: SortingParameter
  id: SortingParameter
  message: SortingParameter
  outcome: SortingParameter
  tool: SortingParameter
  userId: SortingParameter
}

"""A column of mcpAuditEntry the search can look at"""
enum McpauditentrySearchFieldEnum {
  clientId
  conferenceId
  id
  message
  tool
  userId
}

"""
Fuzzy search on mcpAuditEntry, ranked by how close the columns are to the term
"""
input McpauditentrySearchInputArgument {
  """
  Limits the search to these columns. Without it every listed column is searched. Columns the caller may not read are left out, so an empty or fully hidden selection finds no rows.
  """
  fields: [McpauditentrySearchFieldEnum!]
  term: String!
}

input McpauditentryWhereInputArgument {
  AND: [McpauditentryWhereInputArgument!]
  NOT: McpauditentryWhereInputArgument
  OR: [McpauditentryWhereInputArgument!]
  arguments: JSONWhereInputArgument
  clientId: IDWhereInputArgument
  conference: ConferenceWhereInputArgument
  conferenceId: IDWhereInputArgument
  createdAt: DateTimeWhereInputArgument
  durationMs: IntWhereInputArgument
  id: IDWhereInputArgument
  message: StringWhereInputArgument
  outcome: McpcalloutcomeEnum
  tool: StringWhereInputArgument
  user: UserWhereInputArgument
  userId: IDWhereInputArgument
}

enum McpcalloutcomeEnum {
  ERROR
  OK
  REFUSED
}

enum MediaconsentstatusEnum {
  ALLOWED_ALL
  NOT_ALLOWED
  NOT_SET
  PARTIALLY_ALLOWED
}

type Mutation {
  """
  Looks for groups of similar school names among the people of the conference's applications (participant care) and brings the suggestions in line with them: a group found again keeps its decision, groups no longer found are removed.
  """
  analyzeSchoolSuggestions(conferenceId: ID!): Boolean!

  """
  Writes the draft into the registrations, or refuses while it has problems. Participants see the result only once it is released.
  """
  applyAssignment(conferenceId: ID!): Boolean!

  """
  Plans a role for one part of a split delegation or a converted single participant.
  """
  assignAssignmentUnit(roleId: ID, unitId: ID!): Boolean!

  """
  Applies a committee assignment in one go: the head delegate's committee assignment page, or the delegation modal clearing its members' committees (a null committee). Every committee has to be the conference's and seat the member's delegation; one pairing refused, or a committee left with more of a delegation than it seats (CONFLICT), rolls the whole batch back. Answers with the members it seated.
  """
  assignCommitteesToDelegationMembers(assignments: [CommitteeAssignmentInput!]!, conferenceId: ID!): [Delegationmember!]!

  """
  Plans a nation or non-state actor for a whole delegation; no `roleId` plans none.
  """
  assignDelegation(delegationId: ID!, roleId: ID): Boolean!

  """Plans a custom role for a single participant; no `roleId` plans none."""
  assignSingleParticipantRole(roleId: ID, singleParticipantId: ID!): Boolean!

  """
  Plans roles for the unassigned delegations of `size` members, using only roles with exactly that many free seats. Returns how many got one.
  """
  autoAssignDelegations(conferenceId: ID!, size: Int!): Int!

  """
  Plans a custom role for each single participant without one, among the roles they applied for; roles planned by hand stay. Returns how many got one.
  """
  autoAssignSingleParticipants(conferenceId: ID!): Int!

  """
  Puts a delegate or single participant into a supervisor's care by the supervisor's connection code: the caller themselves, or, with `userId`, participant care someone else. A wrong code answers NOT_FOUND (ten in ten minutes: TOO_MANY_ATTEMPTS); a supervisor or team member cannot be supervised (CONFLICT).
  """
  connectToConferenceSupervisor(
    conferenceId: ID!
    connectionCode: String!

    """Somebody else to connect; left out connects the caller."""
    userId: ID
  ): Conferencesupervisor!

  """Plans to turn a single participant into a delegation of their own."""
  convertSingleParticipant(singleParticipantId: ID!): Boolean!

  """
  Saves a copy of a view the caller reads under a new name: a shared view as a personal one anyone may make, or a personal view as a shared one (publishing it). Creating the copy needs what `createTableView` needs for its scope; the original stays.
  """
  copyTableView(
    """The conference the table is opened in."""
    conferenceId: ID!

    """Offered in every conference; false when left out."""
    global: Boolean
    id: ID!

    """A shared copy becomes the default; shared copies only."""
    isDefault: Boolean
    name: String!
    shared: Boolean!
  ): Tableview!

  """
  Adds an agenda item (a topic) to a committee: `planSeats` (project management and content lead) in its conference. NOT_FOUND otherwise.
  """
  createAgendaItem(committeeId: ID!, teaserText: String, title: String!): Committeeagendaitem!

  """
  Writes a new announcement as a draft (the conference's content roles: project management, participant care, content lead; FORBIDDEN otherwise). It needs at least one audience block; a committee, role or survey option of another conference is refused with INVALID_INPUT. Attachments are uploaded through `requestFileUpload` (`announcement`/`attachment`) first.
  """
  createAnnouncement(
    attachmentFileIds: [ID!]
    audiences: [AnnouncementAudienceInput!]!

    """Markdown."""
    body: String!
    conferenceId: ID!
    importance: AnnouncementimportanceEnum

    """Whether its audience is told by mail once it is out."""
    notifyByMail: Boolean
    pinned: Boolean

    """The line under the text saying who speaks; blank for none."""
    signature: String

    """The headline."""
    title: String!
    visibleUntil: DateTime
  ): Announcement!

  """
  Participant care placing a user straight into the delegation holding a role, bypassing the application. The user's delegation membership or single registration in the conference is cleared first; a supervisor or team member is refused with CONFLICT, as is a role with no seat left or a committee that already seats as many of the delegation as it may. The delegation is created for the role if none holds it yet.
  """
  createAppliedDelegationMember(
    """
    A committee of the conference that seats the role; left out seats nowhere.
    """
    assignedCommitteeId: ID

    """A nation or non-state actor of the conference."""
    assignedRoleId: ID!
    conferenceId: ID!
    userId: ID!
  ): Delegationmember!

  """
  Participant care placing a user straight into a custom role as a single participant, bypassing the application. A user who already takes part in the conference, or is on its team, is refused with CONFLICT.
  """
  createAppliedSingleParticipant(
    conferenceId: ID!

    """A custom role of the conference."""
    roleId: ID!
    userId: ID!
  ): Singleparticipant!

  """
  Records a scan of the person in a scanner session. A second scan in the same session is refused with ALREADY_SCANNED. Whether the check passed is decided here, as things stand when the scan is written; a session that only records checks nothing.
  """
  createAttendanceEntry(conferenceId: ID!, sessionId: ID!, userId: ID!): Attendanceentry!

  """Adds an empty day to the conference's schedule."""
  createCalendarDay(conferenceId: ID!, date: Date!, name: String!): Calendarday!

  """
  Adds an entry to a schedule day, on the given tracks of the day. An entry ending before it starts, without a track, or naming a track, place or survey option that is not the day's conference's is refused with INVALID_INPUT.
  """
  createCalendarEntry(
    calendarDayId: ID!

    """Tracks of the day; at least one."""
    calendarTrackIds: [ID!]!
    color: CalendarentrycolorEnum
    description: String
    endTime: DateTime!

    """A Phosphor icon name (such as `gavel`); empty shows none."""
    icon: String
    name: String!
    placeId: ID
    room: String
    startTime: DateTime!

    """
    Shows the entry only to those who picked one of these survey options of the conference (and to the team).
    """
    surveyOptionIds: [ID!]
  ): Calendarentry!

  """
  Adds a track, a parallel strand of the programme, to the conference, running on the given days and meant for the given committees and roles. A name another track of the conference has is refused with CONFLICT; a day, committee or role of another conference with INVALID_INPUT.
  """
  createCalendarTrack(
    """The days it runs on."""
    calendarDayIds: [ID!]

    """The committees whose members the track is for."""
    committeeIds: [ID!]
    conferenceId: ID!

    """
    The roles (nations, non-state actors, custom roles) whose holders it is for.
    """
    conferenceRoleIds: [ID!]
    description: String
    name: String!

    """Where the track goes among the others."""
    sortOrder: Int!
  ): Calendartrack!

  """Adds a committee to the conference."""
  createCommittee(
    abbreviation: String!
    conferenceId: ID!
    name: String!

    """How many seats each nation has in it; at least one."""
    numOfSeatsPerDelegation: Int!
  ): Committee!

  """
  Registers the caller as a supervisor of the conference, or, with `userId`, participant care registers someone else (in any stage). CONFLICT for a sign-up of their own once the conference is over (any earlier stage takes one), for one of their own attending in person while the plausibility checks find something about them (`applicationBlockers`), or when the person takes part in the conference already or is on its team.
  """
  createConferenceSupervisor(
    conferenceId: ID!

    """Whether they attend the conference themselves; true when left out."""
    plansOwnAttendenceAtConference: Boolean

    """
    An existing school as the supervisor's own; neither school argument for none.
    """
    schoolId: ID

    """The name of a school to find (ignoring case and spacing) or create."""
    schoolName: String

    """Somebody else to register; left out registers the caller."""
    userId: ID
  ): Conferencesupervisor!

  """
  Adds a custom role for single participants, such as the press, with how many it seats. A name another role of the conference has is refused with CONFLICT.
  """
  createCustomRole(
    conferenceId: ID!
    description: String

    """
    A Phosphor icon name (such as `leaf`), see phosphoricons.com; empty or left out shows none.
    """
    icon: String
    name: String!

    """How many people the role seats."""
    seatAmount: Int!
  ): Conferencerole!

  """
  Creates a delegation with the caller as its head delegate, who names their own school. Refused with CONFLICT outside the registration window or when the caller already takes part in the conference.
  """
  createDelegation(
    conferenceId: ID!
    experience: String
    motivation: String

    """
    An existing school as the applicant's own; leave out to name one by `schoolName`.
    """
    schoolId: ID

    """
    The name of a school to find (ignoring case and spacing) or create. Neither school argument means no school.
    """
    schoolName: String
  ): Delegation!

  """
  Joins the caller to a delegation by its entry code, with the newcomer's own school. A wrong code answers NOT_FOUND (ten in ten minutes: TOO_MANY_ATTEMPTS); outside the registration window, an applied delegation or a caller already in the conference answer CONFLICT.
  """
  createDelegationMember(
    conferenceId: ID!
    entryCode: String!

    """
    An existing school as the newcomer's own; neither school argument keeps the one they have.
    """
    schoolId: ID

    """The name of a school to find (ignoring case and spacing) or create."""
    schoolName: String
  ): Delegationmember!

  """
  Adds a non-state actor to the conference, with how many seats it has. A name or abbreviation another role of the conference has is refused with CONFLICT.
  """
  createNonStateActor(
    abbreviation: String!
    conferenceId: ID!
    description: String!

    """
    A Phosphor icon name (such as `leaf`), see phosphoricons.com; empty or left out shows none.
    """
    icon: String
    name: String!

    """How many people the role seats."""
    seatAmount: Int!
  ): Conferencerole!

  """
  Writes a new paper with its first version, in the caller's name, for a delegation they are a member of, in that delegation's conference. Refused with FORBIDDEN when the delegation's role does not allow the paper type or agenda item, and with CONFLICT while the conference takes no papers.
  """
  createPaper(
    """The agenda item it is on; left out for an introduction paper."""
    agendaItemId: ID
    content: JSON!
    delegationId: ID!

    """DRAFT to keep working on it, SUBMITTED to hand it in."""
    status: PaperstatusEnum!
    type: PapertypeEnum!
  ): Paper!

  """
  Records a reviewer's verdict on a paper's latest version. Besides writing the review it gives the paper and version that status, has the author told (the `PAPER_REVIEWED` mail, where the conference sends it) and works out whether this was the first review for a "piece" of the flag collection - the gamified progress display. That last part has three shapes: a nation delegation counts one piece per agenda item, a non-state actor's introduction paper is its own piece, and its other papers count up to two more. NOT_FOUND for anyone but the conference's paper team, CONFLICT for a draft.
  """
  createPaperReview(
    comments: JSON!

    """The verdict: ACCEPTED or CHANGES_REQUESTED."""
    newStatus: PaperstatusEnum!
    paperId: ID!
  ): CreatePaperReviewResult!

  """
  Creates a payment reference paid by `userId` for the participants it covers, at the conference's fee per participant. Participant care makes one for anybody; everybody else only in their own name (FORBIDDEN otherwise) and for people they know in the conference: themselves, their delegation, the participants they supervise and the supervisors they share a student with. INVALID_INPUT when somebody named takes no part in the conference or the conference has no fee, CONFLICT when one of them has paid already.
  """
  createPaymentTransaction(
    conferenceId: ID!

    """
    The users this payment covers, at least one; the amount is the fee times their number.
    """
    paymentFor: [ID!]!

    """The payer: the user transferring the money."""
    userId: ID!
  ): Paymenttransaction!

  """
  Adds a place (a venue) the conference's schedule entries can name. A name another place of the conference has is refused with CONFLICT.
  """
  createPlace(
    address: String
    conferenceId: ID!
    directions: String
    info: String

    """Degrees, -90 to 90."""
    latitude: Float

    """Degrees, -180 to 180."""
    longitude: Float
    name: String!

    """
    A file uploaded through `requestFileUpload` for the site plan of a place of this conference.
    """
    sitePlanFileId: ID
    websiteUrl: String
  ): Place!

  """
  Adds an adopted resolution, a PDF participants download after the conference, optionally tagged with one of its committees (INVALID_INPUT for another conference's). The PDF has to be uploaded by the caller through `requestFileUpload` (`resolution`/`content`) and have arrived in full (CONFLICT otherwise).
  """
  createResolution(
    committeeId: ID
    conferenceId: ID!

    """The PDF, uploaded through `requestFileUpload`."""
    fileId: ID!

    """Left out or blank: the name the file was uploaded with."""
    title: String
  ): Resolution!

  """
  Saves a text block the caller reuses in paper reviews: for whoever reviews papers in some conference (`reviewPapers`), FORBIDDEN for anybody else. A name the caller already uses is refused with CONFLICT.
  """
  createReviewerSnippet(content: JSON!, name: String!): Reviewersnippet!

  """
  Adds a role at the end of the delegation's wishes: the head delegate until the delegation has applied, or participant care. A role the delegation already wishes for answers CONFLICT, one with fewer seats than the delegation has members INVALID_INPUT.
  """
  createRoleApplication(
    delegationId: ID!

    """A nation or non-state actor of the delegation's conference."""
    roleId: ID!
  ): Roleapplication!

  """
  Registers the caller as a single participant applying for a custom role, with their own school. An existing registration in the conference that is not sent in yet is updated instead. CONFLICT outside the registration window (for a new one), when already sent in, or when the caller takes part in the conference otherwise.
  """
  createSingleParticipant(
    conferenceId: ID!
    experience: String
    motivation: String

    """A custom role of the conference to apply for."""
    roleId: ID!

    """
    An existing school as the applicant's own; leave out to name one by `schoolName`.
    """
    schoolId: ID

    """
    The name of a school to find (ignoring case and spacing) or create. Neither school argument means no school.
    """
    schoolName: String
  ): Singleparticipant!

  """
  Adds an option to a survey question, with how many may pick it. A title the question already has is refused with CONFLICT.
  """
  createSurveyOption(
    description: String!
    questionId: ID!
    title: String!

    """How many may pick it; 0 for no limit."""
    upperLimit: Int!
  ): Surveyoption!

  """
  Adds a survey question to the conference, by default as a draft participants do not see yet. A title the conference already has is refused with CONFLICT.
  """
  createSurveyQuestion(
    conferenceId: ID!

    """Until when participants answer and change their answer."""
    deadline: DateTime!
    description: String!

    """Hidden from participants until published; default."""
    draft: Boolean

    """Kept from participants even once published."""
    hidden: Boolean

    """Shows a participant's choice on their dashboard."""
    showSelectionOnDashboard: Boolean
    title: String!
  ): Surveyquestion!

  """
  Saves a view of a team table (`#lib/dataGrid`): personal (only the caller's), or shared with everyone who opens the table. A view is the conference's, or with `global` offered in every conference. Needs the table's permission in the conference; shared views `manageTableViews` there, global shared ones a system admin (FORBIDDEN otherwise). A shared view with `isDefault` becomes the table's default in place of the old one.
  """
  createTableView(
    """The conference the table is opened in, even for a global view."""
    conferenceId: ID!

    """Offered in every conference; false when left out."""
    global: Boolean

    """Shared views only."""
    isDefault: Boolean
    name: String!
    shared: Boolean!
    state: JSON!
    tableKey: String!
  ): Tableview!

  """
  Invites several people at once: an address with an account joins the team right away, any other gets a mailed link. Each address is handled independently: one failure (no valid address, already on the team or invited, taking part in the conference, a role the caller may not hand out) is reported in `errors` and the rest still go through, which is why this returns a result object rather than throwing. Project management invites to any role, team coordinators to any but project management.
  """
  createTeamMemberInvitations(conferenceId: ID!, invitations: [CreateInvitationInput!]!): CreateInvitationsResult!

  """
  Puts the caller on the conference's waiting list. CONFLICT unless the conference is in preparation, the caller is not on it yet, and, having applied, the assignment is released and gave them no role.
  """
  createWaitingListEntry(
    conferenceId: ID!
    experience: String!
    motivation: String!
    requests: String

    """
    An existing school as the entrant's own; neither school argument for none.
    """
    schoolId: ID

    """The name of a school to find (ignoring case and spacing) or create."""
    schoolName: String
  ): Waitinglistentry!

  """
  Settles a pair: `CONFIRMED` (one person), `DISMISSED` (two people), or back to `OPEN`, which forgets who decided. A dismissed pair no longer lets the care team read the other account's notes. NOT_FOUND for a pair the caller may not decide.
  """
  decidePossibleDuplicate(id: ID!, status: PossibleduplicatestatusEnum!): Possibleduplicate!

  """Deletes an agenda item; its papers stay, without an agenda item."""
  deleteAgendaItem(id: ID!): Boolean!

  """Deletes an announcement for good."""
  deleteAnnouncement(id: ID!): Boolean!

  """Takes back a recorded scan."""
  deleteAttendanceEntry(id: ID!): Boolean!

  """
  Deletes a schedule day together with its entries. The tracks are the conference's and stay; they no longer run on it. NOT_FOUND for a day the caller may not manage.
  """
  deleteCalendarDay(id: ID!): Boolean!

  """Deletes a schedule entry."""
  deleteCalendarEntry(id: ID!): Boolean!

  """
  Deletes a track from every day; entries that ran on this track alone go with it, entries on others stay.
  """
  deleteCalendarTrack(id: ID!): Boolean!

  """
  Deletes a committee with its agenda items; its resolutions stay without it, and nations it seated alone stop being offered. Refused with CONFLICT while somebody is assigned to it or one of its agenda items has papers.
  """
  deleteCommittee(id: ID!): Boolean!

  """
  Deletes a custom role, together with the wishes for it and its place in the assignment draft. Refused with CONFLICT while somebody holds it.
  """
  deleteCustomRole(id: ID!): Boolean!

  """
  Deletes a delegation together with its members, role applications and papers. The head delegate may until the delegation has applied, participant care at any time.
  """
  deleteDelegation(id: ID!): Boolean!

  """
  Removes a delegate: the member themselves or their head delegate until the delegation has applied, participant care at any time. If the head delegate leaves, another member is promoted; if nobody is left, the delegation itself goes.
  """
  deleteDelegationMember(id: ID!): Boolean!

  """
  Deletes a non-state actor, together with the applications for it and its place in the assignment draft. Refused with CONFLICT while a delegation is assigned to it.
  """
  deleteNonStateActor(id: ID!): Boolean!

  """
  Deletes a paper with all its versions and reviews: its author while it is a draft, project management any time.
  """
  deletePaper(id: ID!): Boolean!

  """Deletes a place; schedule entries at it stay, without a place."""
  deletePlace(id: ID!): Boolean!

  """
  Deletes a resolution; its PDF is removed by the file cleanup once nothing holds it.
  """
  deleteResolution(id: ID!): Boolean!

  """Deletes one of the caller's snippets; another's answers NOT_FOUND."""
  deleteReviewerSnippet(id: ID!): Boolean!

  """
  Removes a wish from the delegation's ranking and closes the gap it leaves.
  """
  deleteRoleApplication(id: ID!): Boolean!

  """
  Deletes a school, for a name typed wrongly: everybody naming it is left without a school. Participant care deletes the schools of its people that nobody outside its conferences names; NOT_FOUND otherwise.
  """
  deleteSchool(id: ID!): Boolean!

  """
  Withdraws a single participant's registration: the participant until it is sent in, participant care at any time.
  """
  deleteSingleParticipant(id: ID!): Boolean!

  """
  Takes back the answer to the question, leaving it unanswered: participants their own until the deadline, participant care anybody’s. NOT_FOUND when there is none the caller may take back.
  """
  deleteSurveyAnswer(
    questionId: ID!

    """Whose answer it is; left out, the caller’s own."""
    userId: ID
  ): Boolean!

  """
  Deletes a survey option. Refused with CONFLICT while somebody has picked it or a schedule entry is limited to it; scanner sessions expecting it simply stop expecting it.
  """
  deleteSurveyOption(id: ID!): Boolean!

  """
  Deletes a survey question. Refused with CONFLICT while it still has options: delete those first.
  """
  deleteSurveyQuestion(id: ID!): Boolean!

  """
