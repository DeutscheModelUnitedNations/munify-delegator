"""
A postal address, modeled after the OIDC `address` claim and schema.org's PostalAddress.
"""
type Address {
  countryCode: String
  locality: String
  postalCode: String
  region: String
  streetAddress: String
}

"""
Input counterpart of Address. countryCode and streetAddress are required — countryCode because there is nothing to validate the other fields against without it, and streetAddress because it's the one field required in every country. The remaining fields are optional since their requiredness genuinely varies by country; validated as a whole using Google's libaddressinput metadata (offline).
"""
input AddressInput {
  countryCode: String!
  locality: String
  postalCode: String
  region: String
  streetAddress: String!
}

enum AdministrativestatusEnum {
  DONE
  PENDING
  PROBLEM
}

"""
How someone's age on the first conference day misses the conference's range.
"""
enum AgeIssue {
  """
  A participant older than `participantMaxAge`, old enough to be a supervisor.
  """
  shouldBeSupervisor

  """A supervisor younger than `supervisorMinAge`."""
  shouldNotBeSupervisor

  """
  A participant older than `participantMaxAge`, yet younger than `supervisorMinAge`.
  """
  tooOld

  """A participant younger than `participantMinAge`."""
  tooYoung
}

"""
The caller's age does not fit the conference's range, and the limits it missed.
"""
type AgeNotice {
  """Their age on the first conference day."""
  age: Int!
  issue: AgeIssue!
  participantMaxAge: Int
  participantMinAge: Int
  supervisorMinAge: Int
}

enum AgeRole {
  participant
  supervisor
}

type AgendaItemPaperGroup {
  """
  Groups are keyed by agenda item, so there is always one - papers without an agenda item are introduction papers and have their own query.
  """
  agendaItem: Committeeagendaitem!
  papers: [Paper!]!
}

