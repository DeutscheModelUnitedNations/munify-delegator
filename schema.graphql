  Ends a supervision, so the supervisor no longer looks after the person: the person, the supervisor, or participant care.
  """
  disconnectFromConferenceSupervisor(
    supervisorId: ID!

    """The supervised person."""
    userId: ID!
  ): Boolean!

  """
  Marks a suggested group of similar school names as no duplicates (participant care), so it is not suggested again.
  """
  dismissSchoolSuggestion(id: ID!): Boolean!

  """
  Answers the question for everybody holding a seat who has not answered it yet, with an option that still has room, so the options fill up evenly. Returns how many answers it gave; whoever found no room is left out. Participant care only (NOT_FOUND otherwise).
  """
  distributeUnansweredSurvey(questionId: ID!): Int!

  """
  Copies an announcement, with its audience and attachments, as a new draft.
  """
  duplicateAnnouncement(id: ID!): Announcement!

  """
  Ends a session for everybody working in it; ending it again changes nothing.
  """
  endAttendanceSession(id: ID!): Boolean!

  """
  Gives a team member a function: `CHAIR` or `CONSULTANT` in a committee of their conference, or `TRUSTED_PERSON` for the whole conference (without a committee). Whoever holds a function answers its inbox in the chats: a committee's chairs or consultants theirs, the trusted persons their shared one and each their own. Project management and team coordinators only (FORBIDDEN otherwise); INVALID_INPUT for a committee of another conference, a committee function without a committee and a trusted person with one.
  """
  giveTeamFunction(committeeId: ID, kind: TeamfunctionkindEnum!, teamMemberId: ID!): Teamfunction!

  """
  The code printed on a person's application documents in the conference, for the holder themselves and participant care (FORBIDDEN for anybody else). It writes nothing, so it publishes nothing.
  """
  issueDocumentCode(
    conferenceId: ID!

    """The holder's user id."""
    userId: ID!
  ): SignedCode!

  """
  A fresh code for the caller's digital nametag in the conference, good for ten minutes, to show as a QR code for the team to scan. A mutation so no client cache can hand back an old, expired one; it writes nothing, so it publishes nothing. Only ever the caller's own id is signed.
  """
  issueNametagCode(conferenceId: ID!): SignedCode!

  """
