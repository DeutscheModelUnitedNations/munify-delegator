  """
  deleteTableView(id: ID!): Boolean!

  """
  Removes someone from the conference's team: project management anybody, team coordinators anybody but project management. NOT_FOUND otherwise; CONFLICT for the last project management (only a system admin may remove them).
  """
  deleteTeamMember(id: ID!): Boolean!

  """
  Takes an entry off the waiting list: the entrant until they are given a seat, participant care at any time.
  """
  deleteWaitingListEntry(id: ID!): Boolean!

  """Deletes the draft. Ratings and weights stay."""
  discardAssignmentDraft(conferenceId: ID!): Boolean!

