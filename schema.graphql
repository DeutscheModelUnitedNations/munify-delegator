"""
An open point the check finds for a scanned person, most important first.
"""
enum ScanIssue {
  """The session holds a scan of the person already."""
  alreadyScanned

  """A minor whose guardian consent is not in."""
  guardianConsentOpen

  """The person has no part in the conference as a participant."""
  notInConference

  """The payment is not complete."""
  paymentOpen

  """The person picked none of the survey options the session expects."""
  surveyOptionMissing

  """A team member: shown, but never scanned in."""
  teamMember

  """The terms and conditions are not signed."""
  termsOpen
}

"""
What the entrance scanner shows of a scanned person: who they are, what they are in the conference and what is still open. When nothing was found, every field but `found` is empty, false or PENDING.
"""
type ScanLookupResult {
  """The calendar day as an ISO date."""
  birthday: String

  """Whether the check finds nothing open."""
  checkPassed: Boolean!

  """Their committee seat."""
  committeeAbbreviation: String

  """Whether their attendance has been recorded."""
  didAttend: Boolean!

  """The person's family name."""
  familyName: String

  """Whether the code leads to somebody with a part in the conference."""
  found: Boolean!

  """The person's given name."""
  givenName: String

  """Their guardian's consent; only checked for minors."""
  guardianConsent: AdministrativestatusEnum!

  """
  Whether the person takes part as a participant (delegate, single participant, supervisor or on the waiting list); not for the team.
  """
  inConference: Boolean!

  """Head delegate of their delegation."""
  isHeadDelegate: Boolean!

  """A supervisor in the conference."""
  isSupervisor: Boolean!

  """On the conference's team."""
  isTeamMember: Boolean!

  """On the waiting list of the conference."""
  isWaitingList: Boolean!

  """What the check finds open for the person, most important first."""
  issues: [ScanIssue!]!

  """
  Whether a scan of the person can be recorded despite the open points: never for the team, somebody outside the conference or a repeated scan.
  """
  mayRecordAnyway: Boolean!

  """
  The titles of the survey options the session expects when the person picked none of them; empty when they did, or without a session expecting any.
  """
  missingSurveyOptions: [String!]!

  """Their delegation's nation (alpha-2)."""
  nationAlpha2Code: String

  """Their delegation's nation (alpha-3)."""
  nationAlpha3Code: String

  """The non-state actor's icon (a Phosphor name)."""
  nonStateActorIcon: String

  """Their delegation's non-state actor."""
  nonStateActorName: String

  """Their payment."""
  paymentStatus: AdministrativestatusEnum!

  """A single participant's custom role."""
  singleRoleName: String

  """Their signed terms and conditions."""
  termsAndConditions: AdministrativestatusEnum!

  """The person's user id."""
  userId: String
}

