# Port-remapped overlay so the e2e database can run alongside other local projects
# that already hold 5432. The mock OIDC provider runs inside the Vite dev server (oidc-mock).
services:
  postgres:
    container_name: postgres-e2e-delegator
    ports: !override
      - 15432:5432
    volumes: !override
      - delegator-e2e:/var/lib/postgresql/data

volumes:
  delegator-e2e:
