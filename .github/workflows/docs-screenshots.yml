name: Docs screenshots

# Regenerates the manual's screenshots from the real app and opens (or updates) a PR when they
# changed, so the manual never shows an outdated UI. Same setup as MUNify CHASE's.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'docs/**'
      - 'messages/**'
      - 'scripts/docs-screenshots/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-bun
      - run: cp .env.example .env
      # The seed uploads its files to the dev bucket (RustFS, as in `bun run dev:docker`)
      - run: docker compose -f dev.docker-compose.yml up -d --wait s3 && docker compose -f dev.docker-compose.yml up s3-init
      - run: bunx svelte-kit sync
      - run: bunx playwright install --with-deps chromium
      - run: bun run docs:screenshots
      # PRs opened with the default GITHUB_TOKEN don't trigger other workflows, so the required
      # checks never run on them. Set a DOCS_SCREENSHOTS_TOKEN secret (a PAT or app token with
      # contents and pull-requests write) to get them. The repo also needs "Allow GitHub Actions
      # to create and approve pull requests" enabled.
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.DOCS_SCREENSHOTS_TOKEN || github.token }}
          branch: docs/screenshots
          add-paths: static/docs-assets/screenshots
          commit-message: 'docs: regenerate manual screenshots'
          title: 'docs: regenerate manual screenshots'
          body: Screenshots regenerated by `bun run docs:screenshots` after changes on main.
          labels: documentation
          delete-branch: true
