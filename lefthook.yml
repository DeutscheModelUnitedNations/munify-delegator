pre-commit:
  # Piped, with explicit priorities: fallow analyses the working tree, so it has
  # to run after prettier has finished rewriting (and re-staging) the same
  # files. Without `priority` lefthook would order the commands alphabetically.
  piped: true
  commands:
    format:
      priority: 1
      run: bunx prettier --ignore-unknown --write "{staged_files}"
      stage_fixed: true
    fallow:
      priority: 2
      # Codebase intelligence (dead code, complexity, duplication, cycles) for
      # what this commit introduces: `--base HEAD` diffs the working tree, which
      # is what is about to be committed. Blocking - the audit exits 1 on a fail
      # verdict, i.e. when the commit introduces new findings (inherited ones do
      # not count). Add `--brief` to make it advisory again. CRAP is scored
      # with the coverage of the last `bun run coverage` / `test:e2e:coverage`
      # (merged into coverage/coverage-final.json), and estimated without one.
      run: bunx fallow audit --base HEAD --quiet --gate-marker pre-commit $([ -f coverage/coverage-final.json ] && echo --coverage coverage/coverage-final.json)
      skip:
        - merge
        - rebase
# The same checks as the CI jobs, made cheap for a push: each one either looks only at the files
# the push changes, or keeps a local cache and redoes only what changed since its last run. CI
# checks the whole repo again without any of it, so whatever a shortcut misses (a prettier or
# eslint upgrade reformatting files nobody touched, say) is caught there. All caches are
# gitignored and safe to delete: .eslintcache, .svelte-kit/.svelte-check, node_modules/.vitest-cache.
pre-push:
  parallel: true
  # Nothing to check when the branch has no commits its remote lacks, such as a push of a tag
  # alone. Without an upstream (a new branch) the comparison fails, and the checks run.
  skip:
    - run: git diff --quiet '@{push}' HEAD
  commands:
    test:
      # vitest, like CI — bun's own runner cannot resolve SvelteKit's aliases and virtual modules.
      # `--sinceLastRun` runs the tests whose recorded dependencies changed since they last ran,
      # and those that failed then; the first run records and runs everything.
      run: bunx vitest run --sinceLastRun
    lint:
      # Only the pushed files (skipped when there are none to lint), and of those only the ones
      # whose content the cache has not seen pass yet.
      glob: '*.{js,cjs,mjs,ts,svelte}'
      run: bunx eslint --cache --cache-strategy content --no-warn-ignored {push_files}
    format:
      run: bunx prettier --check --ignore-unknown {push_files}
    typecheck:
      # Types cross files, so this stays the whole project; `check` is incremental
      # (svelte-check's and TypeScript's build info under .svelte-kit/.svelte-check).
      run: bun run check
    i18n:
      run: bun run i18n:check
    fallow:
      # Same analysis as the fallow CI job, scoped to the whole branch: with no
      # `--base`, fallow audits against the merge-base with the upstream (or
      # `origin/HEAD` / `origin/main`), so you see locally what CI will report
      # on the PR. Advisory for the same reason as above; to gate pushes, drop
      # `--brief` (and consider dropping `continue-on-error` in ci.yml too).
      run: bunx fallow audit --quiet --brief --gate-marker pre-push $([ -f coverage/coverage-final.json ] && echo --coverage coverage/coverage-final.json)
